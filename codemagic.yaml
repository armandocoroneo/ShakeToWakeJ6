workflows:
  android-debug:
    name: Android Debug Build
    instance_type: linux
    max_build_duration: 30

    triggering:
      events:
        - push

    scripts:
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/**/*.apk
